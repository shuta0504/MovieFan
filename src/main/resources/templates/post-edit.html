<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>投稿の編集</title>
	<style>
		/* 全体の設定 */
		body {
			background-color: #141414;
			/* Netflix風の深い黒 */
			color: white;
			padding: 40px;
			font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
		}

		.form-container {
			max-width: 700px;
			margin: auto;
			background: #2a2a2a;
			/* カードの背景色 */
			padding: 40px;
			border-radius: 12px;
			box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
		}

		h2 {
			color: #e50914;
			/* Netflixレッド */
			margin-top: 0;
			margin-bottom: 30px;
			text-align: center;
		}

		/* 入力エリアの共通設定 */
		.form-group {
			margin-bottom: 25px;
		}

		label {
			display: block;
			margin-bottom: 10px;
			color: #b3b3b3;
			font-weight: bold;
			font-size: 14px;
		}

		/* ★ここが重要：はみ出し防止の魔法 */
		input[type="text"],
		input[type="file"],
		textarea {
			width: 100%;
			box-sizing: border-box;
			/* パディングを含めて100%に収める */
			background: #333;
			color: white;
			border: 1px solid #444;
			padding: 12px;
			border-radius: 4px;
			font-size: 16px;
		}

		textarea {
			resize: vertical;
			/* 縦方向のみリサイズ可能に */
		}

		input:focus,
		textarea:focus {
			outline: none;
			border-color: #e50914;
			/* フォーカス時に赤く光らせる */
		}

		button {
			background: #e50914;
			color: white;
			border: none;
			padding: 15px;
			width: 100%;
			cursor: pointer;
			font-weight: bold;
			font-size: 16px;
			border-radius: 4px;
			transition: background 0.3s;
		}

		button:hover {
			background: #ff0a16;
		}

		.cancel-link {
			display: block;
			text-align: center;
			margin-top: 20px;
			color: #b3b3b3;
			text-decoration: none;
			font-size: 15px;
		}
	</style>
</head>

<body>
	<div class="form-container">
		<h2>投稿の編集</h2>

		<form th:action="@{/post/update/{id}(id=${post.id})}" th:object="${post}" method="post"
			enctype="multipart/form-data">

			<div class="form-group">
				<label>映画タイトル</label>
				<input type="text" th:field="*{movieTitle}" class="form-control" required />
			</div>

			<div class="form-group">
				<label>感想（500文字以内）</label>
				<textarea th:field="*{content}" id="content-textarea" maxlength="500" class="form-control"
					required></textarea>
				<small id="char-count" style="color: #888;">0 / 500</small>
			</div>

			<div class="form-group" th:if="${post.imageUrl}">
				<label>現在の画像</label>
				<img th:src="${post.imageUrl}"
					style="width: 150px; border-radius: 8px; display: block; margin-bottom: 10px;">
			</div>

			<div class="form-group">
				<label>画像を差し替える</label>
				<input type="file" name="imageFile" accept="image/*" />
			</div>

			<div class="form-group">
				<label>動画を差し替える</label>
				<input type="file" name="videoFile" accept="video/*" />
			</div>

			<div class="form-group">
				<label>YouTube 動画ID</label>
				<input type="text" th:field="*{youtubeVideoId}" placeholder="例: dQw4w9WgXcQ" />
			</div>

			<div
				style="display: flex; justify-content: center; align-items: center; gap: 20px; margin-top: 30px; width: 100%;">

				<button type="submit"
					style="background-color: #e50914; color: white; border: none; padding: 12px 30px; border-radius: 4px; font-weight: bold; cursor: pointer; width: auto; margin: 0;">
					更新を保存する
				</button>

				<a th:href="@{/post/{id}(id=${post.id})}"
					style="color: #ccc; text-decoration: none; font-size: 14px; white-space: nowrap;">
					キャンセル
				</a>

			</div>
		</form>
	</div>
	<footer
		style="background-color: #141414; padding: 50px 20px; border-top: 1px solid #333; margin-top: 50px; text-align: center;">
		<div style="max-width: 1000px; margin: 0 auto;">

			<p style="color: #fff; font-size: 16px; font-weight: bold; margin-bottom: 25px; letter-spacing: 1px;">CHECK
				ON STREAMING</p>

			<div style="display: flex; justify-content: center; align-items: center; gap: 30px; flex-wrap: wrap;">

				<a href="https://www.youtube.com/" target="_blank" title="YouTube" style="transition: transform 0.3s;"
					onmouseover="this.style.transform='scale(1.2)'" onmouseout="this.style.transform='scale(1)'">
					<svg width="40" height="40" viewBox="0 0 24 24" fill="#e50914">
						<path
							d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z" />
					</svg>
				</a>

				<a href="https://www.netflix.com/" target="_blank" title="Netflix" style="transition: transform 0.3s;"
					onmouseover="this.style.transform='scale(1.2)'" onmouseout="this.style.transform='scale(1)'">
					<svg width="35" height="35" viewBox="0 0 24 24" fill="#e50914">
						<path
							d="M4.303 1.242c.508 0 .917.409.917.917v7.628l7.017-7.901a.917.917 0 0 1 1.414 1.171l-7.734 8.707 7.734 8.707a.917.917 0 0 1-1.414 1.171l-7.017-7.901v7.628a.917.917 0 0 1-1.834 0V2.159c0-.508.409-.917.917-.917z" />
					</svg>
				</a>

				<a href="https://www.amazon.co.jp/gp/video/storefront" target="_blank" title="Prime Video"
					style="transition: transform 0.3s;" onmouseover="this.style.transform='scale(1.2)'"
					onmouseout="this.style.transform='scale(1)'">
					<svg width="40" height="40" viewBox="0 0 24 24" fill="#00A8E1">
						<path
							d="M15.93 17.13c-2.68 1.95-7.12 2.72-9.52 2.72-3.32 0-5.32-.96-5.32-2.73 0-2.3 2.81-2.92 5.34-2.92 1.34 0 2.94.13 4.1.4-.24-.54-.33-.94-.33-1.45 0-1.12.58-1.74 1.74-1.74.85 0 1.56.36 1.87 1.07.1.2.14.41.14.62 0 1.25-.94 2.8-2.66 4.03h4.64zm.44-5.46c-.22-.36-.67-.54-1.21-.54-.62 0-1.07.27-1.34.85-.1.22-.13.45-.13.67 0 .62.31 1.07.89 1.07.58 0 1.03-.27 1.3-.85.13-.22.18-.45.18-.71 0-.18-.09-.36-.69-.49z" />
					</svg>
				</a>

				<a href="https://video.unext.jp/" target="_blank" title="U-NEXT"
					style="color: #444444; text-decoration: none; font-weight: 900; font-size: 22px; transition: transform 0.3s;"
					onmouseover="this.style.transform='scale(1.2)'" onmouseout="this.style.transform='scale(1)'">
					U-NEXT
				</a>

				<a href="https://www.disneyplus.com/" target="_blank" title="Disney+"
					style="color:#336699; text-decoration: none; font-weight: bold; font-size: 18px; transition: transform 0.3s;"
					onmouseover="this.style.transform='scale(1.2)'" onmouseout="this.style.transform='scale(1)'">
					Disney<span style="color: #3cf;">+</span>
				</a>

			</div>

			<p style="color: #555; font-size: 12px; margin-top: 40px;">&copy; 2026 Movie Review App.
			</p>
		</div>
	</footer>

	<script>
		const textarea = document.getElementById('content-textarea');
		const charCount = document.getElementById('char-count');

		// 文字数を更新する関数
		const updateCount = () => {
			const length = textarea.value.length;
			charCount.textContent = `${length} / 500`;
			charCount.style.color = length >= 500 ? "red" : "#888";
		};

		// 入力時と、ページ読み込み時（編集用）の両方で実行
		textarea.addEventListener('input', updateCount);
		window.addEventListener('DOMContentLoaded', updateCount);
	</script>
</body>

</html>
