<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>新規投稿 - MOVIES FAN</title>
	<style>
		body {
			font-family: 'Helvetica Neue', Arial, sans-serif;
			/* 背景画像の設定（映画らしい暗めの画像URLを入れるか、グラデーションに） */
			background: url('https://t3.ftcdn.net/jpg/04/07/53/02/360_F_407530281_vHv9x4ZIxxfBRM9JOa85gZ8GW03bcpzO.jpg');
			background-size: cover;
			background-position: center;
			background-attachment: fixed;
			color: white;
			margin: 0;
			display: flex;
			justify-content: center;
			flex-direction: column;
			min-height: 100vh;
		}

		.form-wrapper {
			background: rgba(42, 42, 42, 0.95);
			/* フォームの背景を少し透けさせる */
			padding: 40px;
			border-radius: 12px;
			box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
			width: 100%;
			max-width: 600px;
			backdrop-filter: blur(5px);
			margin: 60px auto;
		}

		h2 {
			text-align: center; 
			color: #e50914;
			margin-bottom: 30px;
			text-transform: uppercase;
			letter-spacing: 2px;
		}

		label {
			display: block;
			margin-bottom: 8px;
			font-weight: bold;
			color: #ccc;
		}

		input[type="text"],
		textarea {
			width: 100%;
			padding: 12px;
			margin-bottom: 20px;
			background: #333;
			border: 1px solid #444;
			border-radius: 6px;
			color: white;
			box-sizing: border-box;
			/* パディングを含めた幅計算 */
		}

		input[type="file"] {
			margin-bottom: 25px;
			color: #bbb;
		}

		.button-group {
			display: flex;
			align-items: center;
			gap: 20px;
			margin-top: 10px;
		}

		.submit-btn {
			background-color: #e50914;
			color: white;
			border: none;
			padding: 12px 30px;
			border-radius: 5px;
			font-weight: bold;
			cursor: pointer;
			font-size: 16px;
			transition: 0.3s;
		}

		.submit-btn:hover {
			background-color: #ff0a16;
			transform: translateY(-2px);
		}

		.cancel-link {
			color: #ccc;
			text-decoration: none;
			font-size: 0.9em;
		}

		.cancel-link:hover {
			text-decoration: underline;
		}
	</style>
</head>

<body>
	<div class="form-wrapper">
		<h2>新規投稿する</h2>
		<div th:if="${errorMessage}" th:text="${errorMessage}"
			style="background-color: #e67e22; color: white; padding: 15px; margin-bottom: 15px; border-radius: 5px; text-align: center; white-space: pre-line;">
		</div>

		<div th:if="${duplicatePost}"
			style="margin-bottom: 30px; padding: 15px; border: 2px solid #e50914; background: rgba(255,255,255,0.05); border-radius: 8px;">
			<p style="color: #e50914; font-weight: bold; margin-top: 0;">既存の投稿が見つかりました：</p>
			<h3 th:text="${duplicatePost.movieTitle}" style="margin: 5px 0;"></h3>
			<a th:href="@{/post/{id}(id=${duplicatePost.id})}"
				style="color: #3498db; text-decoration: underline;">この投稿を見る</a>
		</div>

		<div id="suggestionArea"
			style="display: none; background: #333; border: 1px solid #555; border-radius: 4px; margin-top: -20px; margin-bottom: 20px;">
			<p style="color: #e50914; font-size: 0.8em; padding: 8px 10px 0;">もしかしてこの映画ではないですか？</p>
			<ul id="suggestionList" style="list-style: none; padding: 5px 0; margin: 0;"></ul>
		</div>

		<form th:action="@{/post/create}" th:object="${post}" method="post" enctype="multipart/form-data">
			<label>映画タイトル</label>
			<input type="text" name="movieTitle" placeholder="タイトルを入力してください" required />

			<div class="form-group">
				<label>感想（500文字以内）</label>
				<textarea name="content" th:field="*{content}" maxlength="500" class="form-control"
					placeholder="映画の感想を書いてください" required></textarea>

				<p th:if="${#fields.hasErrors('content')}" th:errors="*{content}" style="color: red;"></p>

				<small id="char-count" style="color: #888;">0 / 500</small>
			</div>

			<label>画像 (任意)</label>
			<input type="file" name="imageFile" accept="image/*" />

			<label>動画 (任意)</label>
			<input type="file" name="videoFile" accept="video/*" />

			<label>YouTube 動画ID (任意)</label>
			<input type="text" name="youtubeVideoId" placeholder="例: dQw4w9WgXcQ" />
			<p style="font-size: 0.8em; color: #888; margin-top: -15px; margin-bottom: 20px;">
				※YouTubeURLの「embed/」に続く11桁の文字を入力してください。
			</p>

			<div class="button-group">
				<button type="submit" class="submit-btn">投稿する</button>
				<a th:href="@{/}" class="cancel-link">キャンセル</a>
			</div>
		</form>
	</div>
	<footer
		style="background-color: #141414; padding: 50px 20px; border-top: 1px solid #333; margin-top: 50px; text-align: center;">
		<div style="max-width: 1000px; margin: 0 auto;">

			<p style="color: #fff; font-size: 16px; font-weight: bold; margin-bottom: 25px; letter-spacing: 1px;">CHECK
				ON STREAMING</p>

			<div style="display: flex; justify-content: center; align-items: center; gap: 30px; flex-wrap: wrap;">

				<a href="https://www.youtube.com/" target="_blank" title="YouTube" style="transition: transform 0.3s;"
					onmouseover="this.style.transform='scale(1.2)'" onmouseout="this.style.transform='scale(1)'">
					<svg width="40" height="40" viewBox="0 0 24 24" fill="#e50914">
						<path
							d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z" />
					</svg>
				</a>

				<a href="https://www.netflix.com/" target="_blank" title="Netflix" style="transition: transform 0.3s;"
					onmouseover="this.style.transform='scale(1.2)'" onmouseout="this.style.transform='scale(1)'">
					<svg width="35" height="35" viewBox="0 0 24 24" fill="#e50914">
						<path
							d="M4.303 1.242c.508 0 .917.409.917.917v7.628l7.017-7.901a.917.917 0 0 1 1.414 1.171l-7.734 8.707 7.734 8.707a.917.917 0 0 1-1.414 1.171l-7.017-7.901v7.628a.917.917 0 0 1-1.834 0V2.159c0-.508.409-.917.917-.917z" />
					</svg>
				</a>

				<a href="https://www.amazon.co.jp/gp/video/storefront" target="_blank" title="Prime Video"
					style="transition: transform 0.3s;" onmouseover="this.style.transform='scale(1.2)'"
					onmouseout="this.style.transform='scale(1)'">
					<svg width="40" height="40" viewBox="0 0 24 24" fill="#00A8E1">
						<path
							d="M15.93 17.13c-2.68 1.95-7.12 2.72-9.52 2.72-3.32 0-5.32-.96-5.32-2.73 0-2.3 2.81-2.92 5.34-2.92 1.34 0 2.94.13 4.1.4-.24-.54-.33-.94-.33-1.45 0-1.12.58-1.74 1.74-1.74.85 0 1.56.36 1.87 1.07.1.2.14.41.14.62 0 1.25-.94 2.8-2.66 4.03h4.64zm.44-5.46c-.22-.36-.67-.54-1.21-.54-.62 0-1.07.27-1.34.85-.1.22-.13.45-.13.67 0 .62.31 1.07.89 1.07.58 0 1.03-.27 1.3-.85.13-.22.18-.45.18-.71 0-.18-.09-.36-.69-.49z" />
					</svg>
				</a>

				<a href="https://video.unext.jp/" target="_blank" title="U-NEXT"
					style="color: #444444; text-decoration: none; font-weight: 900; font-size: 22px; transition: transform 0.3s;"
					onmouseover="this.style.transform='scale(1.2)'" onmouseout="this.style.transform='scale(1)'">
					U-NEXT
				</a>

				<a href="https://www.disneyplus.com/" target="_blank" title="Disney+"
					style="color:#336699; text-decoration: none; font-weight: bold; font-size: 18px; transition: transform 0.3s;"
					onmouseover="this.style.transform='scale(1.2)'" onmouseout="this.style.transform='scale(1)'">
					Disney<span style="color: #3cf;">+</span>
				</a>

			</div>

			<p style="color: #555; font-size: 12px; margin-top: 40px;">&copy; 2026 Movie Review App.
			</p>
		</div>
	</footer>
	<script>
		// リアルタイムで文字数をカウントするスクリプト
		const textarea = document.querySelector('textarea[name="content"]');
		const charCount = document.getElementById('char-count');

		textarea.addEventListener('input', () => {
			charCount.textContent = `${textarea.value.length} / 500`;
		});
		document.querySelector('input[name="movieTitle"]').addEventListener('input', function () {
			const query = this.value;
			const area = document.getElementById('suggestionArea');
			const list = document.getElementById('suggestionList');

			if (query.length < 2) {
				area.style.display = 'none';
				return;
			}

			fetch(`/api/posts/suggestions?title=${encodeURIComponent(query)}`)
				.then(res => res.json())
				.then(data => {
					if (data.length > 0) {
						list.innerHTML = data.map(p => `
		                    <li style="padding: 8px 15px; border-bottom: 1px solid #444;">
		                        <a href="/post/${p.id}" style="color: #fff; text-decoration: none;">🎬 ${p.movieTitle}</a>
		                    </li>
		                `).join('');
						area.style.display = 'block';
					} else {
						area.style.display = 'none';
					}
				});
		});
	</script>
</body>

</html>
