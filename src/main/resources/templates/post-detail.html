<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title th:text="${post.movieTitle}+'-詳細'"></title>
	<style>
		body {
			background-color: #1a1a1a;
			color: white;
			font-family: sans-serif;
			padding: 40px;
		}

		.container {
			max-width: 800px;
			margin: auto;
		}

		.detail-card {
			background: #2a2a2a;
			padding: 30px;
			border-radius: 12px;
		}

		.title {
			color: #e50914;
			font-size: 2.5em;
			margin-bottom: 20px;
		}

		.full-content {
			font-size: 1.2em;
			line-height: 1.8;
			white-space: pre-wrap;
			margin-bottom: 30px;
		}

		.media-full img,
		.media-full video {
			width: 100%;
			border-radius: 8px;
			margin-bottom: 20px;
		}

		.back-link {
			color: #ccc;
			text-decoration: none;
			display: inline-block;
			margin-top: 20px;
		}

		/* 40行目付近：styleタグの最後の方に追記 */
		.video-container {
			position: relative;
			padding-bottom: 56.25%;
			height: 0;
			overflow: hidden;
			margin-bottom: 20px;
			border-radius: 8px;
		}

		.video-container iframe {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
		}

		/* post-detail.html の <style> の最後に追加 */
		@media (max-width: 768px) {
			.container {
				padding: 15px;
				/* 全体の余白を調整 */
			}

			.detail-card {
				padding: 20px;
			}

			.title {
				font-size: 1.8em;
				/* 映画タイトルをスマホサイズに */
			}

			/* YouTubeや動画を画面幅に合わせる */
			.video-container iframe {
				aspect-ratio: 16 / 9;
				/* 比率を維持 */
				height: auto !important;
			}

			.youtube-link:hover {
				transform: scale(1.1);
				/* 少し大きくする */
				filter: drop-shadow(0 0 5px #e50914);
				/* 赤く光らせる */
			}
		}
	</style>
</head>

<body>
	<div class="container">
		<div class="detail-card">
			<h1 class="title" th:text="${post.movieTitle}"></h1>

			<a th:if="${post.youtubeVideoId != null and !post.youtubeVideoId.isEmpty()}"
				th:href="'https://www.youtube.com/watch?v=' + ${post.youtubeVideoId}" target="_blank"
				rel="noopener noreferrer" class="youtube-link"
				style="display: inline-flex; align-items: center; text-decoration: none; transition: transform 0.2s;">

				<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="#e50914">
					<path
						d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z" />
				</svg>

				<span style="color: #fff; margin-left: 8px; font-size: 14px; font-weight: bold;">YouTubeで見る</span>
			</a>
			<p class="full-content" th:text="${post.content}"></p>

			<div class="media-full">
				<img th:if="${post.imageUrl}" th:src="${post.imageUrl}">
				<video th:if="${post.videoUrl}" th:src="${post.videoUrl}" controls></video>

				<div class="video-container" th:if="${post.youtubeVideoId != null and !post.youtubeVideoId.isEmpty()}">
					<iframe th:src="'https://www.youtube.com/embed/' + ${post.youtubeVideoId}" frameborder="0"
						allowfullscreen></iframe>
				</div>
			</div>
			<p><small th:text="${#temporals.format(post.createdAt,'yyyy/MM/dd HH:mm')}"></small></p>
		</div>

		<div style="margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 25px;">


			<div th:if="${#authentication.principal != 'anonymousUser' and #authentication.principal.id == post.userId}"
				style="display: flex; gap: 20px;">

				<a th:href="@{/post/edit/{id}(id=${post.id})}"
					style="display: inline-block; width: 140px; height: 45px; line-height: 45px; background-color: #444; color: white; text-decoration: none; border-radius: 10px; font-weight: bold; font-size: 16px; text-align: center;">
					編集する
				</a>

				<form th:action="@{/post/delete/{id}(id=${post.id})}" method="post"
					onsubmit="return confirm('この投稿を削除してもよろしいですか？');" style="margin: 0;">
					<button type="submit"
						style="width: 140px; height: 45px; background-color: #e50914; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 16px; display: flex; align-items: center; justify-content: center;">
						削除する
					</button>
				</form>
			</div>
			<div style="margin-top: 40px; border-top: 1px solid #444; padding-top: 20px;">
				<h3 style="color: #e50914;">コメント一覧</h3>

				<div th:each="comment : ${post.comments}"
					style="background: #2a2a2a; padding: 15px; border-radius: 8px; margin-bottom: 15px;">

					<p th:text="${comment.content}" style="margin: 0 0 10px 0; color: #eee; line-height: 1.5;"></p>

					<div style="margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 8px;">
						<small th:text="${#temporals.format(comment.createdAt, 'yyyy/MM/dd HH:mm')}"
							style="color: #888;"></small>

						<small th:if="${comment.updatedAt != null && comment.updatedAt.isAfter(comment.createdAt)}"
							style="color: #666; font-style: italic; margin-left: 10px;">
							(編集済み: <span th:text="${#temporals.format(comment.updatedAt, 'yyyy/MM/dd HH:mm')}"></span>)
						</small>
					</div>
					<div
						style="display: flex; justify-content: flex-end; align-items: center; gap: 15px; margin-top: 5px;">

						<a th:href="@{/comment/edit/{id}(id=${comment.id})}"
							style="color: #e50914; text-decoration: none; font-size: 13px; font-weight: bold; line-height: 1;">
							編集
						</a>

						<form th:action="@{/comment/delete/{id}(id=${comment.id})}" method="post"
							style="margin: 0; padding: 0; display: inline-flex; align-items: center;"
							onsubmit="return confirm('このコメントを削除してもよろしいですか？');">
							<button type="submit"
								style="background: none; border: none; color: #e50914; cursor: pointer; font-size: 13px; padding: 0; font-weight: bold; line-height: 1; vertical-align: middle;">
								削除
							</button>
						</form>
					</div>
				</div>
			</div>
		</div>

		<form th:action="@{/post/{id}/comment(id=${post.id})}" th:object="${comment}" method="post"
			style="margin-top: 20px; width: 100%;">

			<textarea name="content" th:field="*{content}" rows="3" placeholder="この映画にコメントする..."
				style="width: 100%; background: #333; color: white; border: 1px solid #444; padding: 10px; border-radius: 8px; box-sizing: border-box; resize: none;"></textarea>

			<div th:if="${#fields.hasErrors('content')}" th:errors="*{content}"
				style="color: red; font-size: 12px; margin-top: 5px;">
			</div>

			<button type="submit"
				style="margin-top: 10px; width: 100%; height: 40px; background-color: #e50914; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 15px; transition: background 0.2s;">
				投稿する
			</button>
		</form>
	</div>


	<a th:href="@{/}" style="color: #ccc; text-decoration: none; font-size: 14px; opacity: 0.8;">← 一覧に戻る</a>

	</div>

	</div>


	</div>
	<footer
		style="background-color: #141414; padding: 50px 20px; border-top: 1px solid #333; margin-top: 50px; text-align: center;">
		<div style="max-width: 1000px; margin: 0 auto;">

			<p style="color: #fff; font-size: 16px; font-weight: bold; margin-bottom: 25px; letter-spacing: 1px;">CHECK
				ON STREAMING</p>

			<div style="display: flex; justify-content: center; align-items: center; gap: 30px; flex-wrap: wrap;">

				<a href="https://www.youtube.com/" target="_blank" title="YouTube" style="transition: transform 0.3s;"
					onmouseover="this.style.transform='scale(1.2)'" onmouseout="this.style.transform='scale(1)'">
					<svg width="40" height="40" viewBox="0 0 24 24" fill="#e50914">
						<path
							d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z" />
					</svg>
				</a>

				<a href="https://www.netflix.com/" target="_blank" title="Netflix" style="transition: transform 0.3s;"
					onmouseover="this.style.transform='scale(1.2)'" onmouseout="this.style.transform='scale(1)'">
					<svg width="35" height="35" viewBox="0 0 24 24" fill="#e50914">
						<path
							d="M4.303 1.242c.508 0 .917.409.917.917v7.628l7.017-7.901a.917.917 0 0 1 1.414 1.171l-7.734 8.707 7.734 8.707a.917.917 0 0 1-1.414 1.171l-7.017-7.901v7.628a.917.917 0 0 1-1.834 0V2.159c0-.508.409-.917.917-.917z" />
					</svg>
				</a>

				<a href="https://www.amazon.co.jp/gp/video/storefront" target="_blank" title="Prime Video"
					style="transition: transform 0.3s;" onmouseover="this.style.transform='scale(1.2)'"
					onmouseout="this.style.transform='scale(1)'">
					<svg width="40" height="40" viewBox="0 0 24 24" fill="#00A8E1">
						<path
							d="M15.93 17.13c-2.68 1.95-7.12 2.72-9.52 2.72-3.32 0-5.32-.96-5.32-2.73 0-2.3 2.81-2.92 5.34-2.92 1.34 0 2.94.13 4.1.4-.24-.54-.33-.94-.33-1.45 0-1.12.58-1.74 1.74-1.74.85 0 1.56.36 1.87 1.07.1.2.14.41.14.62 0 1.25-.94 2.8-2.66 4.03h4.64zm.44-5.46c-.22-.36-.67-.54-1.21-.54-.62 0-1.07.27-1.34.85-.1.22-.13.45-.13.67 0 .62.31 1.07.89 1.07.58 0 1.03-.27 1.3-.85.13-.22.18-.45.18-.71 0-.18-.09-.36-.69-.49z" />
					</svg>
				</a>

				<a href="https://video.unext.jp/" target="_blank" title="U-NEXT"
					style="color: #444444; text-decoration: none; font-weight: 900; font-size: 22px; transition: transform 0.3s;"
					onmouseover="this.style.transform='scale(1.2)'" onmouseout="this.style.transform='scale(1)'">
					U-NEXT
				</a>

				<a href="https://www.disneyplus.com/" target="_blank" title="Disney+"
					style="color:#336699; text-decoration: none; font-weight: bold; font-size: 18px; transition: transform 0.3s;"
					onmouseover="this.style.transform='scale(1.2)'" onmouseout="this.style.transform='scale(1)'">
					Disney<span style="color: #3cf;">+</span>
				</a>

			</div>

			<p style="color: #555; font-size: 12px; margin-top: 40px;">&copy; 2026 Movie Review App.
			</p>
		</div>
	</footer>
</body>

</html>
